# Serves the built site inside the container. Baobab's gateway sits in front of it,
# terminates TLS, compresses responses and logs requests, so this server only serves files.
server {
	listen 80;
	root /srv/www;
	index index.html;

	server_tokens off;
	access_log off;

	# Redirects such as /_astro -> /_astro/ get a relative Location, so they keep
	# the https scheme and host the visitor used, not this server's http and port.
	absolute_redirect off;

	# Serve the site's own 404 page. `internal` makes /404.html itself return 404, not 200.
	# 403 also becomes 404: folders without an index.html (like /_astro/) return 403,
	# and answering 404 hides that they exist.
	error_page 403 404 =404 /404.html;
	location = /404.html {
		internal;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
